<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hand Particle Interaction | Maor Cohen Falah</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #camera {
    display: none;
  }

  .instruction {
    position: fixed;
    top: 18px;
    left: 22px;
    z-index: 10;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 500;
  }

  .back-link {
    position: fixed;
    top: 18px;
    right: 22px;
    z-index: 10;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    opacity: 0.75;
  }
  .back-link:hover { opacity: 1; }

  .intro-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(3px);
    padding: 24px;
    transition: opacity 0.4s ease;
  }

  .intro-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .intro-card {
    max-width: 360px;
    text-align: center;
    color: white;
    font-family: Arial, sans-serif;
  }

  .intro-emoji {
    font-size: 44px;
    margin-bottom: 16px;
  }

  .intro-card h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
  }

  .intro-card p {
    font-size: 14px;
    line-height: 1.6;
    opacity: 0.8;
    margin: 0 0 24px;
  }

  .intro-dismiss {
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #141414;
    background: #D3F26A;
    border: none;
    border-radius: 999px;
    padding: 11px 26px;
    cursor: pointer;
  }

  .intro-dismiss:hover { opacity: 0.9; }
</style>
</head>

<body>

<div class="intro-overlay" id="introOverlay">
  <div class="intro-card">
    <div class="intro-emoji">👋</div>
    <h1>Raise your hand</h1>
    <p>Allow camera access, then hold your hand up in front of your webcam to push the floating letters out of the way. It's tracked live in the browser, nothing is recorded or sent anywhere.</p>
    <button class="intro-dismiss" id="introDismiss">Got it</button>
  </div>
</div>

<div class="instruction">
  👋 Raise your hand in front of the camera to push the letters
</div>
<a href="playground.html" class="back-link">← Back to Playground</a>

<video id="camera" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("camera");

const introOverlay = document.getElementById("introOverlay");
function dismissIntro() {
  introOverlay.classList.add("hidden");
}
document.getElementById("introDismiss").addEventListener("click", dismissIntro);
introOverlay.addEventListener("click", e => {
  if (e.target === introOverlay) dismissIntro();
});

let width;
let height;

function resize() {
  width = canvas.width = window.innerWidth * devicePixelRatio;
  height = canvas.height = window.innerHeight * devicePixelRatio;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.scale(devicePixelRatio, devicePixelRatio);
}

resize();
window.addEventListener("resize", resize);


/* -----------------------------
   PARTICLES
----------------------------- */

const characters =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const particles = [];

const PARTICLE_COUNT = 180;

for (let i = 0; i < PARTICLE_COUNT; i++) {

  particles.push({
    char:
      characters[
        Math.floor(Math.random() * characters.length)
      ],

    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,

    vx: (Math.random() - 0.5) * 0.25,
    vy: (Math.random() - 0.5) * 0.25,

    size:
      18 + Math.random() * 18,

    rotation:
      Math.random() * Math.PI * 2,

    rotationSpeed:
      (Math.random() - 0.5) * 0.01
  });

}


/* -----------------------------
   HAND POSITION
----------------------------- */

let hand = {
  x: null,
  y: null,
  active: false
};

const INTERACTION_RADIUS = 180;

/*
  Standard 21-point MediaPipe hand
  connections, used to draw the
  skeleton overlay.
*/
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

let handSkeletons = [];
let handCenters = [];


/* -----------------------------
   HAND TRACKING
----------------------------- */

const hands = new Hands({
  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({

  maxNumHands: 2,

  modelComplexity: 1,

  minDetectionConfidence: 0.5,

  minTrackingConfidence: 0.5

});


hands.onResults(results => {

  if (
    results.multiHandLandmarks &&
    results.multiHandLandmarks.length
  ) {

    /*
      MediaPipe coordinates:
      x = 0 → left
      x = 1 → right

      Mirror the X axis because
      webcam behaves like a mirror.
    */

    handSkeletons = results.multiHandLandmarks.map(
      landmarks => landmarks.map(lm => ({
        x: (1 - lm.x) * window.innerWidth,
        y: lm.y * window.innerHeight
      }))
    );

    handCenters = handSkeletons.map(points => points[9]);

    hand.x = handCenters[0].x;
    hand.y = handCenters[0].y;
    hand.active = true;

    dismissIntro();

  } else {

    handSkeletons = [];
    handCenters = [];
    hand.active = false;

  }

});


/* -----------------------------
   CAMERA
----------------------------- */

const camera = new Camera(video, {

  onFrame: async () => {

    await hands.send({
      image: video
    });

  },

  width: 1280,
  height: 720

});

camera.start();


/* -----------------------------
   PARTICLE PHYSICS
----------------------------- */

function updateParticles() {

  particles.forEach(p => {

    /*
      Natural floating movement
    */

    p.x += p.vx;
    p.y += p.vy;

    p.rotation += p.rotationSpeed;


    /*
      Hand interaction
      (every tracked hand pushes particles away)
    */

    handCenters.forEach(center => {

      const dx =
        p.x - center.x;

      const dy =
        p.y - center.y;

      const distance =
        Math.sqrt(dx * dx + dy * dy);

      if (distance < INTERACTION_RADIUS) {

        /*
          Direction away from hand
        */

        const angle =
          Math.atan2(dy, dx);

        /*
          Stronger force when closer
        */

        const force =
          Math.pow(
            1 - distance / INTERACTION_RADIUS,
            2
          );

        p.vx +=
          Math.cos(angle) *
          force *
          3.5;

        p.vy +=
          Math.sin(angle) *
          force *
          3.5;

      }

    });


    /*
      Friction
    */

    p.vx *= 0.985;
    p.vy *= 0.985;


    /*
      Keep particles slowly moving
    */

    p.vx +=
      (Math.random() - 0.5) *
      0.01;

    p.vy +=
      (Math.random() - 0.5) *
      0.01;


    /*
      Bounce off the edges so every
      letter stays on screen
    */

    const margin = p.size * 0.6;

    if (p.x < margin) {
      p.x = margin;
      p.vx = Math.abs(p.vx);
    }

    if (p.x > window.innerWidth - margin) {
      p.x = window.innerWidth - margin;
      p.vx = -Math.abs(p.vx);
    }

    if (p.y < margin) {
      p.y = margin;
      p.vy = Math.abs(p.vy);
    }

    if (p.y > window.innerHeight - margin) {
      p.y = window.innerHeight - margin;
      p.vy = -Math.abs(p.vy);
    }

  });

}


/* -----------------------------
   DRAW
----------------------------- */

function draw() {

  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );


  particles.forEach(p => {

    ctx.save();

    ctx.translate(
      p.x,
      p.y
    );

    ctx.rotate(
      p.rotation
    );

    ctx.font =
      `700 ${p.size}px Arial`;

    ctx.fillStyle =
      "#B88CFF";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      p.char,
      0,
      0
    );

    ctx.restore();

  });

  drawHandSkeletons();

}


/* -----------------------------
   HAND SKELETON OVERLAY
----------------------------- */

function drawHandSkeletons() {

  handSkeletons.forEach((points, i) => {

    const center = handCenters[i];

    /*
      Dashed circle showing the
      interaction radius
    */

    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = "rgba(255, 60, 140, 0.85)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(center.x, center.y, INTERACTION_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    /*
      Skeleton connections
    */

    ctx.save();
    ctx.strokeStyle = "#00FFFF";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";

    HAND_CONNECTIONS.forEach(([a, b]) => {
      const p1 = points[a];
      const p2 = points[b];
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    });

    /*
      Joints
    */

    ctx.fillStyle = "#00FFFF";
    points.forEach(pt => {
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();

  });

}


/* -----------------------------
   ANIMATION LOOP
----------------------------- */

function animate() {

  updateParticles();

  draw();

  requestAnimationFrame(
    animate
  );

}

animate();

</script>

</body>
</html>
