<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hand Particle Interaction | Maor Cohen Falah</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1d2a2e url('hand-particles-bg.jpg?v=1') center/cover no-repeat;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.22);
    pointer-events: none;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #camera {
    display: none;
  }

  .instruction {
    position: fixed;
    top: 18px;
    left: 22px;
    z-index: 10;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }

  .back-link {
    position: fixed;
    top: 18px;
    right: 22px;
    z-index: 10;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    opacity: 0.85;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .back-link:hover { opacity: 1; }

  .intro-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(3px);
    padding: 24px;
    transition: opacity 0.4s ease;
  }

  .intro-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .intro-card {
    max-width: 360px;
    text-align: center;
    color: white;
    font-family: Arial, sans-serif;
  }

  .intro-emoji {
    font-size: 44px;
    margin-bottom: 16px;
  }

  .intro-card h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
  }

  .intro-card p {
    font-size: 14px;
    line-height: 1.6;
    opacity: 0.8;
    margin: 0 0 24px;
  }

  .intro-dismiss {
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #141414;
    background: #D3F26A;
    border: none;
    border-radius: 999px;
    padding: 11px 26px;
    cursor: pointer;
  }

  .intro-dismiss:hover { opacity: 0.9; }
</style>
</head>

<body>

<div class="intro-overlay" id="introOverlay">
  <div class="intro-card">
    <div class="intro-emoji">👋</div>
    <h1>Raise your hand</h1>
    <p>Allow camera access, then hold your hand up in front of your webcam to push the floating letters out of the way. It's tracked live in the browser, nothing is recorded or sent anywhere.</p>
    <button class="intro-dismiss" id="introDismiss">Got it</button>
  </div>
</div>

<div class="instruction">
  👋 Raise your hand in front of the camera to push the letters
</div>
<a href="playground.html" class="back-link">← Back to Playground</a>

<video id="camera" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("camera");

const introOverlay = document.getElementById("introOverlay");
function dismissIntro() {
  introOverlay.classList.add("hidden");
}
document.getElementById("introDismiss").addEventListener("click", dismissIntro);
introOverlay.addEventListener("click", e => {
  if (e.target === introOverlay) dismissIntro();
});

let width;
let height;

function resize() {
  width = canvas.width = window.innerWidth * devicePixelRatio;
  height = canvas.height = window.innerHeight * devicePixelRatio;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.scale(devicePixelRatio, devicePixelRatio);
}

resize();
window.addEventListener("resize", resize);


/* -----------------------------
   PARTICLES
----------------------------- */

const characters =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const particles = [];

const PARTICLE_COUNT = 320;

for (let i = 0; i < PARTICLE_COUNT; i++) {

  particles.push({
    char:
      characters[
        Math.floor(Math.random() * characters.length)
      ],

    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,

    vx: (Math.random() - 0.5) * 0.7,
    vy: (Math.random() - 0.5) * 0.7,

    size:
      18 + Math.random() * 18,

    rotation:
      Math.random() * Math.PI * 2,

    rotationSpeed:
      (Math.random() - 0.5) * 0.01
  });

}


/* -----------------------------
   SENTENCE FORMATION
   When nothing is touching the letters they
   glide into place and spell a sentence.
----------------------------- */

const SENTENCE_LINES = ["I SHOT AND EDITED", "THIS PHOTO IN MEXICO"];
const FORM_DELAY = 2800;

const sentenceLetters = [];
SENTENCE_LINES.forEach(line => {
  line.split("").forEach(ch => {
    if (ch !== " ") sentenceLetters.push(ch);
  });
});

sentenceLetters.forEach((ch, i) => {
  particles[i].char = ch;
  particles[i].target = { x: 0, y: 0, size: 32 };
  particles[i].freeUntil = 0;
});

function layoutSentence() {
  let fs = Math.max(20, Math.min(84, window.innerWidth / 13));
  ctx.save();
  ctx.font = `700 ${fs}px Arial`;
  const longest = Math.max(...SENTENCE_LINES.map(l => ctx.measureText(l).width + l.length * fs * 0.1));
  ctx.restore();
  if (longest > window.innerWidth * 0.88) fs *= (window.innerWidth * 0.88) / longest;
  const spacing = fs * 0.1;
  const lineHeight = fs * 1.35;
  const totalH = lineHeight * SENTENCE_LINES.length;
  ctx.save();
  ctx.font = `700 ${fs}px Arial`;
  let idx = 0;
  SENTENCE_LINES.forEach((line, li) => {
    const widths = line.split("").map(ch => ctx.measureText(ch).width + spacing);
    const lineW = widths.reduce((a, b) => a + b, 0) - spacing;
    let x = (window.innerWidth - lineW) / 2;
    const y = (window.innerHeight - totalH) / 2 + lineHeight * (li + 0.5);
    line.split("").forEach((ch, ci) => {
      if (ch !== " ") {
        const t = particles[idx].target;
        t.x = x + widths[ci] / 2 - spacing / 2;
        t.y = y;
        t.size = fs;
        idx++;
      }
      x += widths[ci];
    });
  });
  ctx.restore();
}

layoutSentence();
window.addEventListener("resize", layoutSentence);


/* -----------------------------
   HAND POSITION
----------------------------- */

let hand = {
  x: null,
  y: null,
  active: false
};

const INTERACTION_RADIUS = 55;

/*
  Every point on the hand (joints, bones and palm)
  can touch a letter, not just the palm center.
*/
function handTouchPoints(points) {
  const out = points.slice();
  HAND_CONNECTIONS.forEach(([a, b]) => {
    [0.25, 0.5, 0.75].forEach(t => {
      out.push({
        x: points[a].x + (points[b].x - points[a].x) * t,
        y: points[a].y + (points[b].y - points[a].y) * t
      });
    });
  });
  const palm = [0, 5, 9, 13, 17].map(i => points[i]);
  const cx = palm.reduce((s, q) => s + q.x, 0) / palm.length;
  const cy = palm.reduce((s, q) => s + q.y, 0) / palm.length;
  out.push({ x: cx, y: cy });
  palm.forEach(q => {
    [0.35, 0.7].forEach(t => {
      out.push({ x: cx + (q.x - cx) * t, y: cy + (q.y - cy) * t });
    });
  });
  return out;
}

/*
  Standard 21-point MediaPipe hand
  connections, used to draw the
  skeleton overlay.
*/
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

let handSkeletons = [];
let handCenters = [];


/* -----------------------------
   HAND TRACKING
----------------------------- */

const hands = new Hands({
  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({

  maxNumHands: 2,

  modelComplexity: 1,

  minDetectionConfidence: 0.5,

  minTrackingConfidence: 0.5

});


hands.onResults(results => {

  if (
    results.multiHandLandmarks &&
    results.multiHandLandmarks.length
  ) {

    /*
      MediaPipe coordinates:
      x = 0 → left
      x = 1 → right

      Mirror the X axis because
      webcam behaves like a mirror.
    */

    handSkeletons = results.multiHandLandmarks.map(
      landmarks => landmarks.map(lm => ({
        x: (1 - lm.x) * window.innerWidth,
        y: lm.y * window.innerHeight
      }))
    );

    handCenters = handSkeletons.flatMap(handTouchPoints);

    hand.x = handSkeletons[0][9].x;
    hand.y = handSkeletons[0][9].y;
    hand.active = true;

    dismissIntro();

  } else {

    handSkeletons = [];
    handCenters = [];
    hand.active = false;

  }

});


/* -----------------------------
   CAMERA
----------------------------- */

const camera = new Camera(video, {

  onFrame: async () => {

    await hands.send({
      image: video
    });

  },

  width: 1280,
  height: 720

});

camera.start();


/* -----------------------------
   COVER + REVEAL
   A dark cover hides the photo. Wherever the
   hand moves it wipes the cover away, then
   the cover slowly fades back in.
----------------------------- */

const COVER_COLOR = "rgba(6, 10, 9, 0.93)";
const REVEAL_SCALE = 1 / 6;
const REVEAL_RADIUS = 80;

const reveal = document.createElement("canvas");
const rctx = reveal.getContext("2d", { willReadFrequently: true });
let revealFrame = 0;

function resizeReveal() {
  reveal.width = Math.ceil(window.innerWidth * REVEAL_SCALE);
  reveal.height = Math.ceil(window.innerHeight * REVEAL_SCALE);
}
resizeReveal();
window.addEventListener("resize", resizeReveal);

function updateReveal() {
  /* cover comes back gradually (~3s) */
  const img = rctx.getImageData(0, 0, reveal.width, reveal.height);
  const d = img.data;
  const dec = (revealFrame++ % 2) ? 2 : 1;
  for (let i = 3; i < d.length; i += 4) {
    if (d[i] > 0) d[i] = d[i] > dec ? d[i] - dec : 0;
  }
  rctx.putImageData(img, 0, 0);

  /* the hand wipes it away */
  const r = REVEAL_RADIUS * REVEAL_SCALE;
  handCenters.forEach(c => {
    const x = c.x * REVEAL_SCALE;
    const y = c.y * REVEAL_SCALE;
    const g = rctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(0.6, "rgba(0,0,0,0.85)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    rctx.fillStyle = g;
    rctx.beginPath();
    rctx.arc(x, y, r, 0, Math.PI * 2);
    rctx.fill();
  });
}

function drawCover() {
  ctx.fillStyle = COVER_COLOR;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  ctx.save();
  ctx.globalCompositeOperation = "destination-out";
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(reveal, 0, 0, window.innerWidth, window.innerHeight);
  ctx.restore();
}


/* -----------------------------
   PARTICLE PHYSICS
----------------------------- */

function updateParticles() {

  const now = performance.now();

  particles.forEach(p => {

    const forming = p.target && now >= p.freeUntil;
    if (p.baseSize === undefined) p.baseSize = p.size;

    /*
      Natural floating movement
    */

    p.x += p.vx;
    p.y += p.vy;

    if (!forming) p.rotation += p.rotationSpeed;


    /*
      Hand interaction
      (every tracked hand pushes particles away)
    */

    handCenters.forEach(center => {

      const dx =
        p.x - center.x;

      const dy =
        p.y - center.y;

      const distance =
        Math.sqrt(dx * dx + dy * dy);

      if (distance < INTERACTION_RADIUS) {

        /*
          Direction away from hand
        */

        if (p.target) p.freeUntil = now + FORM_DELAY;

        const angle =
          Math.atan2(dy, dx);

        /*
          Stronger force when closer
        */

        const force =
          Math.pow(
            1 - distance / INTERACTION_RADIUS,
            2
          );

        p.vx +=
          Math.cos(angle) *
          force *
          2.2;

        p.vy +=
          Math.sin(angle) *
          force *
          2.2;

      }

    });


    /*
      Friction
    */

    if (forming) {
      /* glide into the sentence */
      p.vx += (p.target.x - p.x) * 0.02;
      p.vy += (p.target.y - p.y) * 0.02;
      p.vx *= 0.86;
      p.vy *= 0.86;
      const full = Math.PI * 2;
      p.rotation += (Math.round(p.rotation / full) * full - p.rotation) * 0.1;
      p.size += (p.target.size - p.size) * 0.1;
    } else {
      p.vx *= 0.99;
      p.vy *= 0.99;
      p.size += (p.baseSize - p.size) * 0.05;
    }


    /*
      Keep particles slowly moving
    */

    if (!forming) {
      p.vx +=
        (Math.random() - 0.5) *
        0.03;

      p.vy +=
        (Math.random() - 0.5) *
        0.03;
    }


    /*
      Bounce off the edges so every
      letter stays on screen
    */

    const margin = p.size * 0.6;

    if (p.x < margin) {
      p.x = margin;
      p.vx = Math.abs(p.vx);
    }

    if (p.x > window.innerWidth - margin) {
      p.x = window.innerWidth - margin;
      p.vx = -Math.abs(p.vx);
    }

    if (p.y < margin) {
      p.y = margin;
      p.vy = Math.abs(p.vy);
    }

    if (p.y > window.innerHeight - margin) {
      p.y = window.innerHeight - margin;
      p.vy = -Math.abs(p.vy);
    }

  });

}


/* -----------------------------
   DRAW
----------------------------- */

function draw() {

  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );

  drawCover();

  particles.forEach(p => {

    ctx.save();

    ctx.translate(
      p.x,
      p.y
    );

    ctx.rotate(
      p.rotation
    );

    ctx.font =
      `700 ${p.size}px Arial`;

    ctx.fillStyle =
      "#D3F26A";

    ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
    ctx.shadowBlur = 6;

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      p.char,
      0,
      0
    );

    ctx.restore();

  });

  drawHandSkeletons();

}


/* -----------------------------
   HAND SKELETON OVERLAY
----------------------------- */

function drawHandSkeletons() {

  handSkeletons.forEach((points, i) => {

    /*
      Skeleton connections
    */

    ctx.save();
    ctx.strokeStyle = "#00FFFF";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";

    HAND_CONNECTIONS.forEach(([a, b]) => {
      const p1 = points[a];
      const p2 = points[b];
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    });

    /*
      Joints
    */

    ctx.fillStyle = "#00FFFF";
    points.forEach(pt => {
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();

  });

}


/* -----------------------------
   ANIMATION LOOP
----------------------------- */

function animate() {

  updateParticles();
  updateReveal();

  draw();

  requestAnimationFrame(
    animate
  );

}

animate();

</script>

</body>
</html>
