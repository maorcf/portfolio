<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140">
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="t"/>
    <feColorMatrix in="t" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.6" intercept="0.15"/>
      <feFuncG type="linear" slope="1.6" intercept="0.15"/>
      <feFuncB type="linear" slope="1.6" intercept="0.15"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>
